<script>
'use strict';
const data = JSON.parse(document.querySelector('#data').textContent);
const search = document.querySelector('#search'), validation = document.querySelector('#validation');
const all = document.querySelector('#all'), index = document.querySelector('#index'), cards = document.querySelector('#cards');
const count = document.querySelector('#count'), results = document.querySelector('#results');
let selected = 'usuario-solicitacao';

function element(tag, text, className) {
  const item = document.createElement(tag);
  if (text) item.textContent = text;
  if (className) item.className = className;
  return item;
}
function normalize(text) {
  return text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}
function buildCard(item) {
  const card = element('article');
  card.id = 'email-' + item.id;
  const header = element('div', null, 'card-head');
  header.append(element('div', data.groups[item.group] + ' · ' + item.route, 'category'), element('h2', item.title));
  const meta = element('dl');
  const fields = [
    ['Assunto', item.subject], ['Para', item.to], ['Anexo', item.attachment ? 'PDF de comprovante' : 'Sem anexo'],
    ['Link no corpo', item.link || 'Sem link de validação ou redefinição']
  ];
  for (const [label, value] of fields) meta.append(element('dt', label), element('dd', value));
  header.append(meta);
  if (item.note) header.append(element('p', item.note, 'note'));
  const frame = element('iframe', null, 'email-frame');
  frame.title = 'Prévia de e-mail: ' + item.title;
  frame.setAttribute('sandbox', 'allow-same-origin');
  const guard = '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:; form-action \'none\'"><style>html{scrollbar-width:none}body{overflow-wrap:anywhere}a{cursor:default;pointer-events:none}</style>';
  const resize = () => {
    if (!frame.contentDocument?.body) return;
    frame.style.height = '1px';
    frame.style.height = Math.ceil(Math.max(frame.contentDocument.documentElement.scrollHeight, frame.contentDocument.body.scrollHeight)) + 'px';
  };
  frame.addEventListener('load', () => {
    for (const link of frame.contentDocument?.querySelectorAll('a') || []) link.removeAttribute('href');
    resize();
  });
  frame.resizeEmail = resize;
  frame.srcdoc = /<head[^>]*>/i.test(item.html)
    ? item.html.replace(/<head[^>]*>/i, match => match + guard)
    : '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">' + guard + '</head><body>' + item.html + '</body></html>';
  card.append(header, frame);
  const source = element('details', null, 'extras');
  source.append(element('summary', item.text ? 'Origem e versão em texto simples' : 'Origem da mensagem'), element('p', item.source));
  if (item.text) source.append(element('pre', item.text));
  card.append(source);
  return card;
}
function update() {
  const terms = normalize(search.value.trim()).split(/\s+/).filter(Boolean);
  const onlyValidation = validation.getAttribute('aria-pressed') === 'true';
  const visible = data.entries.filter(item => (!onlyValidation || item.link === 'Validação de e-mail') &&
    terms.every(term => normalize([item.title, item.subject, item.note, item.route, data.groups[item.group], item.link].join(' ')).includes(term)));
  if (!visible.some(item => item.id === selected)) selected = visible[0]?.id;
  const showingAll = all.getAttribute('aria-pressed') === 'true';
  count.textContent = visible.length + ' de ' + data.entries.length + ' mensagens · Dados fictícios e links demonstrativos. Nenhum e-mail enviado.';
  results.textContent = visible.length + (visible.length === 1 ? ' mensagem disponível' : ' mensagens disponíveis');
  const oldScroll = index.scrollTop;
  index.replaceChildren();
  for (const [id, name] of Object.entries(data.groups)) {
    const items = visible.filter(item => item.group === id);
    if (!items.length) continue;
    const group = element('section');
    group.append(element('h2', name));
    for (const item of items) {
      const button = element('button', null);
      button.type = 'button';
      button.dataset.id = item.id;
      button.append(element('span', item.title));
      if (item.link === 'Validação de e-mail') {
        const mark = element('span', '✓', 'mark');
        mark.setAttribute('aria-label', 'Contém link de validação');
        button.append(mark);
      }
      if (item.id === selected) button.setAttribute('aria-current','true');
      button.addEventListener('click', () => {
        selected = item.id;
        if (showingAll) {
          document.getElementById('email-' + selected)?.scrollIntoView();
          index.querySelector('[aria-current]')?.removeAttribute('aria-current');
          button.setAttribute('aria-current','true');
        } else {
          update();
          index.querySelector('[data-id="' + selected + '"]')?.focus({preventScroll:true});
          if (matchMedia('(max-width: 760px)').matches) cards.scrollIntoView({block:'start'});
        }
      });
      group.append(button);
    }
    index.append(group);
  }
  const display = showingAll ? visible : visible.filter(item => item.id === selected);
  cards.replaceChildren(...(display.length ? display.map(buildCard) : [element('p', 'Nenhuma mensagem corresponde à busca.', 'no-results')]));
  index.scrollTop = oldScroll;
}
search.addEventListener('input', update);
for (const button of [validation,all]) button.addEventListener('click', () => {
  const active = button.getAttribute('aria-pressed') === 'true';
  button.setAttribute('aria-pressed', String(!active));
  if (button === all) button.textContent = active ? 'Ver todas' : 'Ver uma por vez';
  update();
});
addEventListener('resize', () => document.querySelectorAll('.email-frame').forEach(frame => frame.resizeEmail()));
update();
</script>
