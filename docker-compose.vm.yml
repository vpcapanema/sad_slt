# SICARD — stack de produção para a VM AWS (mesma VM do SIGMA, sa-east-1)
# Sobe: docker compose -f docker-compose.vm.yml up -d
# Banco: conecta internamente ao container sigma_pli_db pela rede compartilhada
# sigma-backend-network, sem sair pelo IP público da própria VM.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sicard-app:latest
    container_name: sicard_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      SIGMA_API_BASE: "http://sigma_pli_backend_prod:8000"
      SIGMA_POSTGRES_HOST: "sigma_pli_db"
      SIGMA_POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:8070:8080"
    networks:
      - default
      - sigma-backend
    mem_limit: 1024m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  sigma-backend:
    external: true
    name: sigma-backend-network
