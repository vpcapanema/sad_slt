# SICARD — stack de produção para a VM AWS (mesma VM do SIGMA, sa-east-1)
# Sobe: docker compose -f docker-compose.vm.yml up -d
# Banco: conecta direto em 56.125.163.194:5433 (container sigma_pli_db, já existente),
# via variáveis SIGMA_POSTGRES_* do .env — não precisa de rede Docker dedicada.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sicard-app:latest
    container_name: sicard_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:8070:8080"
    mem_limit: 1024m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
