# SICARD — stack de produção para a VM AWS (mesma VM do SIGMA, sa-east-1)
# Sobe: docker compose -f docker-compose.vm.yml up -d
# Banco: conecta internamente ao container sigma_pli_db pela rede compartilhada
# sigma-backend-network, sem sair pelo IP público da própria VM.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sicard-app:latest
    container_name: sicard_app
    # A trava que impede criar duas demandas do mesmo PDF do SEI vive na
    # memória deste processo. Não aumentar workers sem uma trava compartilhada.
    command: ["sh", "-c", "exec uvicorn api.server:app --host 0.0.0.0 --port 8080 --workers 1"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sem isto o container roda em UTC e as datas gravadas sem fuso aparecem
      # tres horas a frente para quem usa o sistema em Sao Paulo.
      TZ: "America/Sao_Paulo"
      PORT: "8080"
      SICARD_STORAGE_WRITE_DIR: /app/storage-escrita
      SICARD_STORAGE_TEMP_DIR: /app/storage-escrita/temporarios-sicard
      TMPDIR: /app/storage-escrita/temporarios-sicard
      TMP: /app/storage-escrita/temporarios-sicard
      TEMP: /app/storage-escrita/temporarios-sicard
      CPL_TMPDIR: /app/storage-escrita/temporarios-sicard
      SQLITE_TMPDIR: /app/storage-escrita/temporarios-sicard
      PYTHONDONTWRITEBYTECODE: "1"
      SIGMA_API_BASE: "http://sigma_pli_backend_prod:8000"
      SIGMA_POSTGRES_HOST: "sigma_pli_db"
      SIGMA_POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:8070:8080"
    read_only: true
    volumes:
      # Ambas as montagens apontam ao acervo administrado pelo SFTPGo.
      # create_host_path=false impede criar uma pasta local por engano.
      - type: bind
        source: ../sicard-storage/dados/sicard
        target: /app/data/storage
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../sicard-storage/dados/sicard
        target: /app/storage-escrita
        bind:
          create_host_path: false
    networks:
      - default
      - sigma-backend
    # O gerador de camadas municipais chega perto de 1 GB numa selecao grande,
    # e o kernel matava o processo no meio. A VM tem folga de sobra.
    mem_limit: 2048m
    mem_reservation: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5
    logging:
      # Nao manter logs de aplicacao no disco local do host.
      driver: "none"

networks:
  sigma-backend:
    external: true
    name: sigma-backend-network
