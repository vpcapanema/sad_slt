<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>SICARD — Favorabilidade da rede por subtrecho DER</title>
  <link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css">
  <style>
    html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; }
    #mapa { position: absolute; inset: 0; }
    .painel {
      position: absolute; z-index: 500; top: 12px; left: 52px; width: 340px;
      background: #fff; padding: 12px 14px; border-radius: 6px;
      box-shadow: 0 1px 6px rgba(0,0,0,.25);
    }
    h1 { font-size: 16px; margin: 0 0 6px; }
    p, label { margin: 0 0 8px; color: #333; }
    select { width: 100%; }
    .legenda { display: flex; gap: 2px; height: 10px; margin-top: 8px; }
    .legenda span { flex: 1; }
    .cinza { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <div id="mapa"></div>
  <aside class="painel">
    <h1>Favorabilidade da rede</h1>
    <p>Unidade: subtrecho da malha DER-SP. Cinza: sem dado no subtrecho. TomTom ausente não é imputado nem vira média municipal.</p>
    <label for="camada">Camada</label>
    <select id="camada"></select>
    <div class="legenda" id="legenda"></div>
    <p class="cinza" id="resumo"></p>
  </aside>
  <script src="/assets/vendor/leaflet/leaflet.js"></script>
  <script src="catalogo.js"></script>
  <script src="rede.js"></script>
  <script>
    const cores = ["#FFFFCC", "#C7E9B4", "#7FCDBB", "#41B6C4", "#2C7FB8", "#253494"];
    const mapa = L.map("mapa", { zoomControl: true }).setView([-22.2, -48.6], 7);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap", maxZoom: 18
    }).addTo(mapa);
    const select = document.getElementById("camada");
    CATALOGO.forEach((item) => {
      const opcao = document.createElement("option");
      opcao.value = item.campo;
      opcao.textContent = item.rotulo;
      select.appendChild(opcao);
    });
    document.getElementById("legenda").innerHTML = cores.map((cor) => `<span style="background:${cor}"></span>`).join("");
    let camada;
    function cor(valor) {
      if (valor === null || valor === undefined || Number.isNaN(valor)) return "#bdbdbd";
      return cores[Math.min(cores.length - 1, Math.floor(Number(valor) * cores.length))];
    }
    function desenhar(campo) {
      if (camada) mapa.removeLayer(camada);
      let validos = 0;
      camada = L.geoJSON(REDE, {
        style: (f) => ({ color: cor(f.properties[campo]), weight: 2.2, opacity: 0.9 }),
        onEachFeature: (f, layer) => {
          const p = f.properties;
          if (p[campo] !== null) validos += 1;
          layer.bindPopup(
            `<b>${p.Rodovia || ""} ${p.Subtrecho || ""}</b><br>` +
            `km ${p.KmInicial}–${p.KmFinal} · ${p.Municipio || ""}<br>` +
            `${campo}: ${p[campo] === null ? "sem dado" : p[campo]}<br>` +
            `critérios usados na média: ${p.n_criterios} · ${p.ext_km} km`
          );
        }
      }).addTo(mapa);
      document.getElementById("resumo").textContent =
        `${validos} de ${REDE.features.length} subtrechos com valor nesta camada.`;
    }
    select.addEventListener("change", () => desenhar(select.value));
    desenhar(select.value);
    mapa.fitBounds(camada.getBounds(), { padding: [24, 24] });
  </script>
</body>
</html>
