<header class="cabecalho-barra-lateral layout-sidebar-header">

      <span class="moldura-simbolo app-header-icon-frame" aria-hidden="true">
        <img src="/assets/img/brand/sicard-simbolo.png" alt="" class="simbolo-sicard app-header-icon sidebar-app-icon">
      </span>
      <span class="identificacao-painel app-brand"><span class="nome-sistema app-brand-title">SICARD</span><small>{{ subtitulo | default("Painel administrativo") }}</small></span>
    </a>
  </div>
</header>
<header class="cabecalho-principal-painel app-header layout-main-header">

      {% if bloco_modulo %}{% include "componentes/navbar_modulo/" ~ bloco_modulo ~ ".html" %}{% else %}
      <a href="/restrict/">Início</a>
      <a href="/restrict/painel/">Painel de demandas</a>
      <a href="/restrict/demandas/">Tabela de demandas</a>
      <a href="/restrict/hierarquizacao/">Hierarquização e Ranking</a>
      <a href="/public/documentacao/">Documentação</a>
