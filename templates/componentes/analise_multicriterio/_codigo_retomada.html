<details class="collab-retomada" id="collab-retomada"
         data-api="/api/ahp/comparacao-colaborativa/publico/{{ token }}/inscricao" data-email="{{ inscricao.email }}">
  <summary>Código de retomada</summary>
  <p>Guarde o código para retomar sua resposta em outro navegador ou dispositivo com o e-mail da inscrição.</p>
  <input class="c-form-control" id="collab-retomada-codigo" aria-label="Código de retomada" autocomplete="off" readonly hidden>
  <p id="collab-retomada-feedback" role="status"></p>
</details>
