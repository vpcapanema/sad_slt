{#
  Modal — coluna "Matriz de critérios e premissas" · seção "Hierarquizações realizadas" · página "Gestão das hierarquizações".
  Inclui botão de download (Baixar) do JSON da matriz.
#}
<div id="modal-matriz" class="json-modal-backdrop hidden" data-modal role="dialog" aria-modal="true" aria-labelledby="modal-matriz-title">
  <div class="json-modal">
    <header class="json-modal-head">
      <h2 id="modal-matriz-title" data-modal-title>Matriz de critérios e premissas</h2>
      <div class="json-modal-head-actions">
        <button class="btn btn-secondary btn-sm" data-modal-download type="button"><i class="fas fa-download"></i> Baixar</button>
        <button class="json-modal-close" data-modal-close aria-label="Fechar"><i class="fas fa-xmark"></i></button>
      </div>
    </header>
    <div class="json-modal-body" data-modal-body></div>
  </div>
</div>
