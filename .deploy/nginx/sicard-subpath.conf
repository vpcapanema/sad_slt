# =============================================================================
# SICARD — sub-rota sob o Nginx principal do SIGMA
#
# Publica a aplicação em https://56.125.163.194/sicard/, usando o HTTPS e o
# certificado do server{} principal do SIGMA (sigma-pli-ip.conf).
#
# A app usa caminhos absolutos fixos (/assets, /api, /public, /restrict, /data);
# o header X-Forwarded-Prefix aciona o SubpathRewriteMiddleware (api/middleware/
# subpath_rewrite.py), que reescreve essas strings nas respostas e no header
# Location — sem precisar de sub_filter aqui no Nginx.
#
# Instalar em /etc/nginx/snippets/sicard-subpath.conf e incluir DENTRO do
# server{} :443 do SIGMA:
#   include /etc/nginx/snippets/sicard-subpath.conf;
# A instalação automática é feita por .deploy/update_vm.sh.
# =============================================================================

location = /sicard {
    return 301 /sicard/;
}

# Painel do storage de arquivos brutos (SFTPGo, contêiner sicard_storage).
# Prefixo mais longo que /sicard/, então o Nginx o escolhe antes da aplicação.
# O SFTPGo roda com web_root=/sicard/storage: o caminho segue inteiro, sem
# reescrita. Só a porta 443 é pública; o SFTPGo escuta em 127.0.0.1:8095.
location = /sicard/storage {
    return 301 /sicard/storage/web/admin;
}

location ^~ /sicard/storage/ {
    proxy_pass http://127.0.0.1:8095;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header Connection         "";
    proxy_redirect off;
    client_max_body_size 64m;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
}

# API REST do SFTPGo, só a área do usuário: é por ela que a aplicação grava os
# uploads no storage (api/services/storage_remoto.py), tanto na VM quanto de um
# servidor local. O SFTPGo serve a API em /api/v2, fora do web_root; a API de
# administração (/api/v2/admin...) não é publicada.
location ^~ /sicard/storage-api/user/ {
    proxy_pass http://127.0.0.1:8095/api/v2/user/;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header Connection         "";
    proxy_redirect off;
    proxy_request_buffering off;
    client_max_body_size 170m;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
}

# Ponte do modal nativo de envio: preserva os 64 MB do cliente SFTPGo.
# Configuração local para um futuro deploy autorizado; não altera o storage.
location ^~ /sicard/api/geoespacial/extracao-atributos/storage-upload/ {
    proxy_pass http://127.0.0.1:8070/api/geoespacial/extracao-atributos/storage-upload/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /sicard;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 64m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

# Entrada local temporária: não fazer spool do upload ou da prévia em disco.
# Inclui a execução, que recebe novamente o arquivo original em base64.
location ^~ /sicard/api/geoespacial/extracao-atributos/ {
    proxy_pass http://127.0.0.1:8070/api/geoespacial/extracao-atributos/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /sicard;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 32m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

location ^~ /sicard/ {
    proxy_pass http://127.0.0.1:8070/;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /sicard;
    proxy_set_header Connection         "";
    proxy_redirect off;
    # Envio de PDFs do SEI é em lote: o corpo soma os arquivos da requisição.
    # Mantenha acima de LIMITE_LOTE_BYTES em api/services/sei_repositorio_service.py.
    client_max_body_size 170m;
    proxy_connect_timeout 10s;
    proxy_send_timeout    900s;
    proxy_read_timeout    900s;
}
