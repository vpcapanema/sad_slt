# SICARD — storage de arquivos brutos (SFTPGo), instância própria do SICARD.
# Não usa nem toca o MinIO e o GeoServer do SIGMA que rodam na mesma VM.
#
# Na VM fica numa pasta própria, fora do checkout do SICARD (o deploy faz
# git reset --hard no checkout e apagaria o que estivesse lá). Credenciais em
# .env na mesma pasta, com permissão só do dono; nunca versionar esse arquivo.
#
# Sobe: docker compose -f docker-compose.storage.yml up -d

name: sicard-storage

services:
  storage:
    # Versão fixa: o template ajustado abaixo foi copiado desta versão, e uma
    # atualização automática poderia torná-lo incompatível.
    image: drakkan/sftpgo:v2.7.5
    container_name: sicard_storage
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "America/Sao_Paulo"
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${SFTPGO_ADMIN_USER}
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD}
      # Cliente web: é onde se navega pelas pastas e arquivos no navegador, em
      # /sicard/storage/web/client, com o usuário sicard. O painel de
      # administração só gerencia usuários, senhas e quotas.
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_CLIENT: "true"
      # O painel é publicado pelo Nginx em https://<vm>/sicard/storage/
      # (.deploy/nginx/sicard-subpath.conf). Sem o web_root os links do painel
      # apontariam para a raiz do site, que é do SIGMA.
      SFTPGO_HTTPD__WEB_ROOT: "/sicard/storage"
      # O Nginx do host chega pelo gateway da rede do contêiner. Só dele o
      # SFTPGo aceita X-Forwarded-For, para enxergar o IP real de quem acessa.
      SFTPGO_HTTPD__BINDINGS__0__PROXY_ALLOWED: "192.168.16.1"
      SFTPGO_HTTPD__BINDINGS__0__CLIENT_IP_PROXY_HEADER: "X-Forwarded-For"
      # Painel exposto na internet: bloqueia o IP após tentativas inválidas.
      SFTPGO_COMMON__DEFENDER__ENABLED: "true"
      # Português só na área de arquivos (static/locales/pt); o que não tem
      # tradução cai no inglês, inclusive o painel de administração. O nome
      # "Português" no seletor vem do template ajustado.
      SFTPGO_HTTPD__BINDINGS__0__LANGUAGES: "pt,en"
      # Identidade visual do SICARD. Caminhos relativos a /static; os arquivos
      # ficam em ./static/sicard e o CSS só redefine as cores do tema.
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__NAME: "SICARD Storage"
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__SHORT_NAME: "SICARD"
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__LOGO_PATH: "/sicard/logo.png"
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__FAVICON_PATH: "/sicard/favicon.png"
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_CLIENT__EXTRA_CSS: "/sicard/cores.css"
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__NAME: "SICARD Storage"
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__SHORT_NAME: "SICARD"
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__LOGO_PATH: "/sicard/logo.png"
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__FAVICON_PATH: "/sicard/favicon.png"
      SFTPGO_HTTPD__BINDINGS__0__BRANDING__WEB_ADMIN__EXTRA_CSS: "/sicard/cores.css"
    ports:
      # SFTP. Só a porta 22 é pública; o acesso de fora é por túnel SSH.
      - "127.0.0.1:2222:2022"
      # Painel. Público apenas através do Nginx na porta 443.
      - "127.0.0.1:8095:8080"
    volumes:
      - ./dados:/srv/sftpgo/data
      - ./backups:/srv/sftpgo/backups
      - ./config:/var/lib/sftpgo
      # Tamanhos em kB/MB/GB (base 1000) em vez de KiB/MiB/GiB. O SFTPGo não tem
      # opção para isso: a unidade está fixa em templates/common/base.html, então
      # a cópia ajustada substitui só esse arquivo. Refazer ao trocar de versão.
      - ./templates/common/base.html:/usr/share/sftpgo/templates/common/base.html:ro
      # Marca do SICARD (logo, ícone e cores) e a tradução da área de arquivos.
      - ./static/sicard:/usr/share/sftpgo/static/sicard:ro
      - ./locales/pt/translation.json:/usr/share/sftpgo/static/locales/pt/translation.json:ro
    # A VM não tem swap: sem limite, um pico aqui poderia derrubar outro serviço.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
