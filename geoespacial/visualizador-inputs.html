<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizador de Inputs — Módulo Geoespacial</title>
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/geoespacial.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body class="geoespacial-page">
  <div class="geoespacial-map-layout">
    <header class="geoespacial-header">
      <a href="index.html" class="geoespacial-header-brand">
        <img src="../assets/img/slt-icon.svg" alt="" width="32" height="32">
        <div>
          <h1 class="geoespacial-header-title">Visualizador de Inputs</h1>
          <p class="geoespacial-header-subtitle">Todas as camadas importadas no sistema</p>
        </div>
      </a>
      <nav class="geoespacial-header-nav">
        <button type="button" class="geoespacial-operation-btn" id="btn-abrir-camadas">Abrir Camadas</button>
        <button type="button" class="geoespacial-operation-btn" id="btn-importar-camadas">Importar Camadas</button>
      </nav>
    </header>

    <aside class="geoespacial-sidebar-left">
      <div class="geoespacial-layers-panel">
        <h2 class="geoespacial-layers-title">Camadas</h2>
        <div id="geoespacial-layers-list" class="geoespacial-operations-list">
          <p class="hint">Nenhuma camada carregada.</p>
        </div>
      </div>
    </aside>

    <div class="geoespacial-map-container">
      <div id="map-geoespacial" class="geoespacial-map"></div>
    </div>

    <aside class="geoespacial-sidebar-right">
      <div class="geoespacial-operations-panel">
        <h2 class="geoespacial-operations-title">Operações</h2>
        <div id="geoespacial-operations-list" class="geoespacial-operations-list">
          <p class="hint">Selecione uma operação no menu superior.</p>
        </div>
      </div>

      <div id="geoespacial-variables-panel" class="geoespacial-variables-panel hidden">
        <h3 class="geoespacial-variables-title">Variáveis</h3>
        <div id="geoespacial-variables-container"></div>
      </div>

      <div id="geoespacial-progress-panel" class="geoespacial-progress-panel hidden">
        <h3 class="geoespacial-progress-title">Progresso</h3>
        <div class="geoespacial-progress-bar">
          <div id="geoespacial-progress-fill" class="geoespacial-progress-fill" style="width: 0%"></div>
        </div>
        <p id="geoespacial-progress-text" class="geoespacial-progress-text">0%</p>
        <div id="geoespacial-logs" class="geoespacial-logs"></div>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="../assets/js/geoespacial-map.js"></script>
  <script src="geoespacial-visualizador-inputs.js"></script>
</body>
</html>
