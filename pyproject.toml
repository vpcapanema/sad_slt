[project]
name = "slt-apoio-decisao"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pyshp>=2.3.1",
    "shapely>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.1.0",
    "geopandas>=0.14.0",
    "gdal>=3.7.0; sys_platform != 'win32'",
    "gdal @ https://github.com/cgohlke/geospatial-wheels/releases/download/v2026.2.26/gdal-3.12.2-cp312-cp312-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.12' and platform_machine == 'AMD64'",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.1.0",
    "rasterio>=1.3.0",
    "rioxarray>=0.14.0",
    "fiona>=1.9.0",
]

[tool.pyright]
include = ["api"]
exclude = ["scripts/**", "**/__pycache__", "**/.venv"]
extraPaths = ["."]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.pylint.main]
init-hook = 'import sys; sys.path.insert(0, ".")'
py-version = "3.11"
max-line-length = 88
jobs = 0
disable = [
    "duplicate-code",
    "missing-function-docstring",
    "missing-module-docstring",
    "missing-class-docstring",
    "too-few-public-methods",
    "too-many-return-statements",
    "import-outside-toplevel",
    "broad-exception-caught",
    "ungrouped-imports",
    "unused-import",
    "line-too-long",
    "trailing-newlines",
    "missing-final-newline",
    "wrong-import-position",
    "invalid-character-carriage-return",
    "invalid-name",
]
